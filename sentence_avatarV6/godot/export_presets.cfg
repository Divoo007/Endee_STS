html/head_include="<style>\n  #sentence-form { position:relative; z-index:10; font-family:sans-serif; background:#1a1b1f; color:#eee; padding:14px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }\n  #sentence-form input[type=text] { flex:1; min-width:260px; padding:9px 10px; border-radius:6px; border:1px solid #444; background:#2a2b30; color:#fff; font-size:15px; }\n  #sentence-form select, #sentence-form button { padding:9px 14px; border-radius:6px; border:1px solid #444; background:#2a2b30; color:#fff; font-size:15px; }\n  #sentence-form button { background:#4c6ef5; cursor:pointer; border:none; font-weight:600; }\n  #sentence-form button:disabled { opacity:0.5; cursor:not-allowed; }\n  #sentence-status { position:relative; z-index:10; font-family:sans-serif; color:#ff8080; padding: 4px 16px 6px 16px; min-height:1.2em; background:#1a1b1f; margin:0; }\n</style>\n<script>\n  window.onGodotReady = function () {\n    var btn = document.getElementById('perform-btn');\n    if (btn) { btn.disabled = false; btn.textContent = 'Perform'; }\n    if (window.layoutCanvas) { window.layoutCanvas(); }\n  };\n  window.onGodotError = function (msg) {\n    var el = document.getElementById('sentence-status');\n    if (el) { el.textContent = msg; }\n  };\n  window.addEventListener('DOMContentLoaded', function () {\n    var form = document.createElement('div');\n    form.id = 'sentence-form';\n    form.innerHTML =\n      '<input type=\"text\" id=\"sentence-input\" placeholder=\"e.g. You are drinking tea tomorrow. (Happy)\" value=\"You are drinking tea tomorrow. (Happy)\">' +\n      '<button id=\"perform-btn\" disabled>Loading avatar...</button>';\n    var status = document.createElement('div');\n    status.id = 'sentence-status';\n    document.body.insertBefore(status, document.body.firstChild);\n    document.body.insertBefore(form, document.body.firstChild);\n\n    window.layoutCanvas = function () {\n      var canvas = document.getElementById('canvas');\n      if (!canvas) { return; }\n      var bottom = status.getBoundingClientRect().bottom;\n      canvas.style.position = 'absolute';\n      canvas.style.left = '0px';\n      canvas.style.top = bottom + 'px';\n      canvas.style.width = '100vw';\n      canvas.style.height = 'calc(100vh - ' + bottom + 'px)';\n    };\n    window.layoutCanvas();\n    window.addEventListener('resize', window.layoutCanvas);\n    setTimeout(window.layoutCanvas, 300);\n    setTimeout(window.layoutCanvas, 1500);\n\n    function submit() {\n      var sentence = document.getElementById('sentence-input').value;\n      document.getElementById('sentence-status').textContent = '';\n      if (window.godotPerform) { window.godotPerform(sentence); }\n    }\n    document.getElementById('perform-btn').addEventListener('click', submit);\n    document.getElementById('sentence-input').addEventListener('keydown', function (e) {\n      if (e.key === 'Enter') { submit(); }\n    });\n  });\n</script>\n"
